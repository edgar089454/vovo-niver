<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>76 Anos - Uma Vida de História</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CONFIG -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ["Playfair Display", "serif"],
                        sans: ["Lato", "sans-serif"],
                    },
                    colors: {
                        gold: {
                            50: "#FBF8F1",
                            100: "#F5EEDB",
                            200: "#EADBB6",
                            300: "#DFC791",
                            400: "#D4B46C",
                            500: "#C9A147",
                            600: "#A18139",
                            700: "#79612B",
                            800: "#50401C",
                            900: "#28200E",
                        },
                        stone: {
                            850: "#1c1917",
                            950: "#0c0a09",
                        }
                    },
                    animation: {
                        "fade-in-up": "fadeInUp 1.5s ease-out forwards",
                        "fade-in": "fadeIn 1.5s ease-out forwards",
                        "bounce-slow": "bounce 3s infinite",
                        "letter-in": "letterIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards",
                        "float": "float 6s ease-in-out infinite",
                    },
                    keyframes: {
                        fadeInUp: {
                            "0%": { opacity: "0", transform: "translateY(15px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" },
                        },
                        fadeIn: {
                            "0%": { opacity: "0" },
                            "100%": { opacity: "1" },
                        },
                        letterIn: {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" },
                        },
                        float: {
                            "0%, 100%": { transform: "translateY(0)" },
                            "50%": { transform: "translateY(-20px)" },
                        },
                    }
                }
            }
        };
    </script>

    <!-- ❌ REMOVIDO: Importmaps (causava tela preta no Vite) -->

</head>
<body class="bg-stone-950 text-stone-200 antialiased selection:bg-gold-700 selection:text-white">
    <div id="root"></div>

    <!-- Vite insere o script final automaticamente -->
</body>
</html>
